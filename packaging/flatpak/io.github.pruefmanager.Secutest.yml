# Flatpak-Manifest – gebaut im Release-Workflow aus dist/flatpak-src
# (erzeugt von scripts/build-linux-packages.js aus dem linux-x64-Paket)
app-id: io.github.pruefmanager.Secutest
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: secutest-pruefmanager
finish-args:
  # lokaler Webserver (127.0.0.1) und Browser über das Portal
  - --share=network
  - --share=ipc
  # serielle Schnittstellen (USB-RS232-Adapter, /dev/ttyUSB*)
  - --device=all
  # Datenbanken in OneDrive/iCloud/Dokumente im Benutzerordner
  - --filesystem=home
modules:
  - name: secutest-pruefmanager
    buildsystem: simple
    no-autogen: true
    build-options:
      strip: false
      no-debuginfo: true
    build-commands:
      - mkdir -p /app/lib/secutest-pruefmanager
      - cp -a app runtime /app/lib/secutest-pruefmanager/
      - install -Dm755 secutest-pruefmanager.sh /app/bin/secutest-pruefmanager
      - install -Dm644 io.github.pruefmanager.Secutest.desktop /app/share/applications/io.github.pruefmanager.Secutest.desktop
      - install -Dm644 io.github.pruefmanager.Secutest.metainfo.xml /app/share/metainfo/io.github.pruefmanager.Secutest.metainfo.xml
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/io.github.pruefmanager.Secutest.svg
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.pruefmanager.Secutest.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.pruefmanager.Secutest.png
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.pruefmanager.Secutest.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.pruefmanager.Secutest/LICENSE
    sources:
      - type: dir
        path: ../../dist/flatpak-src
