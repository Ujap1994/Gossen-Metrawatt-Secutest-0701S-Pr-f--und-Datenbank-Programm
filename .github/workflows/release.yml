name: Release

# Bei jeder Änderung auf main: testen, das Desktop-Programm (Electron) für alle Plattformen bauen,
# jedes gepackte Programm testen (Selbsttest + Oberfläche mit Simulator), die Linux-Pakete in
# Distributionen installieren und als GitHub-Release veröffentlichen.
# Pull Requests, die das Paketieren ändern, durchlaufen alles außer der Veröffentlichung.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'electron/**'
      - 'build/**'
      - 'e2e/**'
      - 'scripts/selftest-packaged.js'
      - 'scripts/release-notes.js'
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Pakete ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac
            app: 'dist/electron/mac-arm64/Secutest Pruefmanager.app'
            exe: 'dist/electron/mac-arm64/Secutest Pruefmanager.app/Contents/MacOS/Secutest Pruefmanager'
          - name: Windows
            os: windows-latest
            args: --win
            app: dist/electron/win-unpacked
            exe: 'dist/electron/win-unpacked/Secutest Pruefmanager.exe'
          - name: Linux
            os: ubuntu-latest
            args: --linux
            app: dist/electron/linux-unpacked
            exe: dist/electron/linux-unpacked/secutest-pruefmanager
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Linux – Werkzeuge für rpm/pacman, Sandbox für Electron
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm libarchive-tools
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Bauen
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Selbsttest im gepackten Programm
        run: node scripts/selftest-packaged.js "${{ matrix.app }}"
      - name: Oberfläche im gepackten Programm (Simulator)
        shell: bash
        env:
          SECUTEST_E2E_APP: ${{ github.workspace }}/${{ matrix.exe }}
        run: if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npx playwright test; else npx playwright test; fi
      - name: Pakete sammeln
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          cp dist/electron/*.{dmg,zip,exe,AppImage,deb,rpm,pacman,tar.gz} out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: out/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.name }}
          path: |
            dist/e2e-results/
            dist/e2e-screenshots/
          retention-days: 7

  # Snap und Flatpak: eigene Werkzeuge, dürfen ausnahmsweise scheitern (dann im Release als „nicht enthalten“ vermerkt)
  snap-flatpak:
    name: Pakete Snap & Flatpak
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder squashfs-tools
          sudo snap install snapcraft --classic
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Snap bauen
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --linux snap --x64 --publish never
      - name: Flatpak bauen
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --linux flatpak --x64 --publish never
      - name: Pakete sammeln
        run: |
          mkdir -p out
          cp dist/electron/*.snap dist/electron/*.flatpak out/ 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-SnapFlatpak
          path: out/
          if-no-files-found: ignore
          retention-days: 7

  distros:
    name: Installation ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 24.04, image: 'ubuntu:24.04', cmd: 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /r/*-linux-amd64.deb' }
          - { name: Ubuntu 22.04 (Mindestversion), image: 'ubuntu:22.04', cmd: 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /r/*-linux-amd64.deb' }
          - { name: Debian 12, image: 'debian:12', cmd: 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /r/*-linux-amd64.deb' }
          - { name: Fedora, image: 'fedora:latest', cmd: 'dnf install -y -q /r/*-linux-x86_64.rpm' }
          - { name: Rocky Linux 9 (Mindestversion), image: 'rockylinux:9', cmd: 'dnf install -y -q /r/*-linux-x86_64.rpm' }
          # zypper-Code 106: ein Spiegelserver war nicht erreichbar, das Paket ist trotzdem installiert (der Selbsttest prüft das)
          - { name: openSUSE Tumbleweed, image: 'opensuse/tumbleweed', cmd: 'zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm /r/*-linux-x86_64.rpm || [ \$? -eq 106 ]' }
          - { name: Arch Linux, image: 'archlinux:latest', cmd: 'pacman -Sy --noconfirm && pacman -U --noconfirm /r/*-linux-x64.pacman' }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg-Linux
          path: release
      # ohne Bildschirm: Selbsttest im Node-Modus des installierten Programms (SQLCipher, serialport, Simulator)
      - name: Installieren & Selbsttest
        run: >
          docker run --rm -v "$PWD/release:/r" "${{ matrix.image }}" sh -c "${{ matrix.cmd }}
          && test -x /usr/bin/secutest-pruefmanager
          && test -f /usr/share/applications/secutest-pruefmanager.desktop
          && ELECTRON_RUN_AS_NODE=1 '/opt/Secutest Pruefmanager/secutest-pruefmanager' '/opt/Secutest Pruefmanager/resources/app.asar/src/server.js' --selftest"

  # Zusätzlich auf ARM- und Intel-Hardware (blockiert das Release nicht)
  smoke-extra:
    name: Selbsttest ${{ matrix.target }} (zusätzlich)
    needs: build
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, target: linux-arm64, pkg: Linux }
          - { os: windows-11-arm, target: windows-arm64, pkg: Windows }
          - { os: macos-15-intel, target: macos-x64, pkg: macOS }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.pkg }}
          path: release
      - name: Selbsttest
        shell: bash
        env:
          T: ${{ matrix.target }}
        run: |
          set -e
          case "$T" in
            linux-arm64)
              docker run --rm -v "$PWD/release:/r" ubuntu:24.04 sh -c "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /r/*-linux-arm64.deb && ELECTRON_RUN_AS_NODE=1 '/opt/Secutest Pruefmanager/secutest-pruefmanager' '/opt/Secutest Pruefmanager/resources/app.asar/src/server.js' --selftest"
              chmod +x release/*-linux-arm64.AppImage && cd /tmp && "$GITHUB_WORKSPACE"/release/*-linux-arm64.AppImage --appimage-extract >/dev/null && node "$GITHUB_WORKSPACE/scripts/selftest-packaged.js" squashfs-root ;;
            windows-arm64)
              pwsh -Command "Start-Process -Wait -FilePath (Get-Item release/*-win-arm64-setup.exe).FullName -ArgumentList '/S','/D=C:\SP'"
              node scripts/selftest-packaged.js 'C:\SP' ;;
            macos-x64)
              mkdir app && ditto -x -k release/*-mac-x64.zip app && node scripts/selftest-packaged.js "app/Secutest Pruefmanager.app"
              mkdir uni && ditto -x -k release/*-mac-universal.zip uni && node scripts/selftest-packaged.js "uni/Secutest Pruefmanager.app" ;;
          esac

  publish:
    name: Pakete prüfen & veröffentlichen
    needs: [build, distros, snap-flatpak]
    if: ${{ always() && needs.build.result == 'success' && needs.distros.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: release
          merge-multiple: true
      - name: Version, Prüfsummen & Release-Notizen
        id: v
        run: |
          VERSION="$(node -p "require('./package.json').version")-build.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          (cd release && sha256sum * > SHA256SUMS.txt)
          node scripts/release-notes.js "$VERSION" release > notes.md
          cat notes.md
      # Nur veröffentlichen, wenn alle Pflichtpakete gebaut wurden – die Download-Tabelle nennt ausschließlich vorhandene Dateien
      - name: Vollständigkeit prüfen
        run: node scripts/release-notes.js "${{ steps.v.outputs.version }}" release --check
      - name: GitHub-Release veröffentlichen
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v${VERSION}" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Secutest Prüfmanager ${VERSION}" \
            --notes-file notes.md \
            --latest
